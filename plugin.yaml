name: sovereign-finance
label: Sovereign Finance
version: 0.1.0
description: A Smart Agentic Wallet for your Hermes agent on BNB Chain and Ethereum. Self-custodial. Your passkey is the admin, and the agent's session key is limited onchain. Powered by Altana.
author: gabonaut
license: MIT
homepage: https://github.com/gabonaut/hermes-sovereign-finance
manifest_version: 2
api_version: 1
kind: standalone
requires_hermes: ">=0.23.0"
platforms:
  - macos
  - linux
tags:
  - wallet
  - defi
  - onchain
provides_tools:
  - sovereign_status
  - sovereign_positions
  - sovereign_quote
  - sovereign_execute
  - sovereign_skill
provides_hooks:
  - pre_tool_call
